server.port=${PORT:8080}
server.address=0.0.0.0
spring.jackson.serialization.write-dates-as-timestamps=false
purpleloop.detection.brute-force-failure-threshold=${PURPLELOOP_DETECTION_BRUTE_FORCE_FAILURE_THRESHOLD:3}
purpleloop.detection.detection-window=${PURPLELOOP_DETECTION_WINDOW:PT5M}
purpleloop.detection.distributed-failure-threshold=${PURPLELOOP_DETECTION_DISTRIBUTED_FAILURE_THRESHOLD:6}
purpleloop.detection.minimum-distinct-source-ips=${PURPLELOOP_DETECTION_MINIMUM_DISTINCT_SOURCE_IPS:3}
purpleloop.detection.brute-force-enabled=${PURPLELOOP_DETECTION_BRUTE_FORCE_ENABLED:true}
purpleloop.detection.distributed-enabled=${PURPLELOOP_DETECTION_DISTRIBUTED_ENABLED:true}
purpleloop.detection.simulation-rate-limit=${PURPLELOOP_DETECTION_SIMULATION_RATE_LIMIT:20}
purpleloop.detection.simulation-rate-window=${PURPLELOOP_DETECTION_SIMULATION_RATE_WINDOW:PT1M}
purpleloop.detection.max-event-history-size=${PURPLELOOP_DETECTION_MAX_EVENT_HISTORY_SIZE:10000}
purpleloop.detection.max-alert-history-size=${PURPLELOOP_DETECTION_MAX_ALERT_HISTORY_SIZE:5000}
